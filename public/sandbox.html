<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Folly Studio sandbox</title>
</head>
<body>
<!--
  Folly Studio's pattern sandbox. The app embeds it as
  <iframe sandbox="allow-scripts" src="/sandbox.html"> and the server serves it with the
  pattern core inlined in place of the marker below, under
  Content-Security-Policy: default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; worker-src blob:; sandbox allow-scripts
  so pattern code runs at an opaque origin with no network, no cookies and no storage.
  Protocol: studio/SPEC.md "Sandbox protocol". No external resources, ever.

  Pattern code never runs on this page's thread. A same-process iframe shares the app's main
  thread, so a `while (true) {}` here would freeze the whole tab and no watchdog could fire.
  Instead the core plus the runner below go into a Worker made from a Blob (it inherits this
  page's CSP, so it has no network either), and this page only relays messages and keeps time.
  When a job overruns, it terminates the worker, finds the layer to blame (the layer it was
  compiling, or by running each layer alone for one frame in a throwaway worker), reports that
  layer as hung, and starts a fresh worker with the others.
-->
<script type="text/x-folly-core" id="pattern-core">/*@CORE@*/</script>
<script type="text/x-folly-runner" id="pattern-runner">
// ---- runs inside the Worker, after the core ------------------------------------------------
const post = self.postMessage.bind(self);   // captured before any pattern code can touch it
let scene = null;
let prepared = [];                            // render order, bottom first
const compiledById = new Map();               // layer id -> { code, compiled, error }: same code keeps its state
const now = () => performance.now();
const message = (e) => (e && e.message ? e.message : String(e));

function onInit(msg) {
  scene = prepareScene(msg.cathedral);
  prepared = [];
  compiledById.clear();
  post({ type: 'ready' });
}

function onLook(msg) {
  const layers = Array.isArray(msg.layers) ? msg.layers : [];
  const report = [];
  const next = [];
  const keep = new Set();
  for (const layer of layers) {
    const id = layer.id;
    keep.add(id);
    let entry = compiledById.get(id);
    try {
      if (!scene) throw new Error('sandbox has no cathedral yet (send init first)');
      if (!entry || entry.code !== layer.code) {
        entry = { code: layer.code, compiled: null, error: '' };
        compiledById.set(id, entry);
        post({ type: 'compiling', id });      // so a hang can be pinned on this layer
        entry.compiled = compilePattern(layer.code);
      }
      if (!entry.compiled) throw new Error(entry.error || 'pattern did not compile');
      next.push(prepareLayer(scene, layer, entry.compiled));
      report.push({ id, ok: true, params: entry.compiled.params });
    } catch (e) {
      if (entry && !entry.compiled) entry.error = message(e);
      report.push({ id, ok: false, error: message(e), params: entry && entry.compiled ? entry.compiled.params : {} });
    }
  }
  for (const id of [...compiledById.keys()]) if (!keep.has(id)) compiledById.delete(id);
  prepared = next;
  post({ type: 'compiled', layers: report });
}

function onFrame(msg) {
  const started = now();
  const rgb = new Float32Array(scene ? scene.count * 3 : 0);
  let errors = [];
  if (scene) errors = renderFrame(scene, prepared, +msg.t || 0, rgb).errors;
  post({ type: 'frame', seq: msg.seq, rgb, errors, ms: now() - started }, [rgb.buffer]);
}

function onRender(msg) {
  if (!scene) throw new Error('sandbox has no cathedral yet (send init first)');
  const frames = Math.max(0, Math.floor(+msg.frames || 0));
  const fps = +msg.fps > 0 ? +msg.fps : 40;
  const start = +msg.start || 0;
  const opts = { gamma: msg.gamma, brightness: msg.brightness };
  const size = scene.frameChannels;
  const channels = new Uint8Array(frames * size);
  const rgb = new Float32Array(scene.count * 3);
  const seen = new Map();                     // id -> first error, across the render
  for (let f = 0; f < frames; f++) {
    const { errors } = renderFrame(scene, prepared, start + f / fps, rgb);
    for (const e of errors) if (!seen.has(e.id)) seen.set(e.id, e.error);
    toChannels(scene, rgb, channels.subarray(f * size, (f + 1) * size), opts);
    post({ type: 'progress', seq: msg.seq, done: f + 1 });   // the page's watchdog counts these
  }
  const errors = [...seen].map(([id, error]) => ({ id, error }));
  post({ type: 'rendered', seq: msg.seq, channels, frames, channelCount: size, errors }, [channels.buffer]);
}

self.addEventListener('message', (event) => {
  const msg = event.data;
  if (!msg || typeof msg !== 'object') return;
  try {
    switch (msg.type) {
      case 'init': onInit(msg); break;
      case 'look': onLook(msg); break;
      case 'frame': onFrame(msg); break;
      case 'render': onRender(msg); break;
      default: break;
    }
  } catch (e) {
    post({ type: 'error', seq: msg.seq, request: msg.type, error: message(e) });
  }
});
</script>
<script>
// ---- this page: relay between the app and the worker, and the watchdog ----------------------
(() => {
  'use strict';
  const app = window.parent;
  const toApp = (msg, transfer) => app.postMessage(msg, '*', transfer || []);

  const FRAME_BUDGET_MS = 1000;   // a frame (live or export) running longer than this has hung
  const LOOK_BUDGET_MS = 700;     // compiling a look's new code
  const INIT_BUDGET_MS = 6000;    // preparing the scene (no pattern code runs)
  const ANSWER_MS = 1500;         // every frame request is answered by then (runtime.js waits longer)
  const PROBE_MS = 600;           // one layer alone: compile + one frame, once its scene is ready
  const PROBE_START_MS = 5000;    // a probe worker that cannot even start is inconclusive
  const PROBE_PARALLEL = 4;
  const PROGRESS_EVERY = 40;      // export progress goes to the app every 40 frames or 250 ms
  const PROGRESS_MS = 250;
  const STRIKE_WINDOW_MS = 30000; // unexplained hangs: restart once, then pause the suspects
  const TICK_MS = 100;
  const FROZEN_GAP_MS = 600;      // a tick this late means this thread was busy or frozen: no blame

  const core = document.getElementById('pattern-core').textContent;
  const runner = document.getElementById('pattern-runner').textContent;
  if (!/\bfunction\s+renderFrame\b/.test(core)) {
    // Opened straight from disk or served without the server's inlining.
    toApp({ type: 'error', error: 'core not inlined' });
    return;
  }
  // A classic worker (module workers cannot start from a blob at an opaque origin). The core is
  // an ES module, so its `export` keywords go, and everything sits in one function scope where
  // pattern code (compiled with new Function, at global scope) cannot see or change it.
  const workerSource = '(function () {\n"use strict";\n' +
    core.replace(/^[ \t]*export[ \t]+(?=(?:async[ \t]+)?function\b|const\b|let\b|var\b|class\b)/gm, '')
      .replace(/^[ \t]*export[ \t]*\{[^}]*\}[ \t]*;?/gm, '') +
    '\n;\n' + runner + '\n})();\n';
  const workerUrl = URL.createObjectURL(new Blob([workerSource], { type: 'text/javascript' }));
  const now = () => performance.now();

  let cathedral = null;
  let count = 0;
  let worker = null;
  let jobs = [];              // sent to `worker`, oldest first; the head is what it is working on
  let held = null;            // jobs that arrived while finding a culprit (null when not recovering)
  let sentLook = [];          // layers of the newest look given to the worker (as the app sent them)
  let baseLook = [];          // layers of the newest look the worker finished
  const hung = new Map();     // id -> { code, error, params }: paused until its code changes
  const loadHangs = new Map(); // code -> error, for code whose top level hung (deterministic)
  const schemas = new Map();  // id -> last params schema, reported for paused layers
  let strikes = [];
  let timer = 0;
  let lastTick = 0;

  // -- workers -------------------------------------------------------------------------------

  function startWorker() {
    let w;
    try {
      w = new Worker(workerUrl, { name: 'folly-patterns' });
    } catch (e) {
      toApp({ type: 'error', error: `The pattern worker could not start: ${e && e.message ? e.message : e}` });
      return null;
    }
    w.onmessage = (e) => onWorker(w, e.data);
    w.onerror = (e) => { e.preventDefault(); };    // stray async errors from pattern code
    return w;
  }

  const layerId = (l, n) => (l && l.id !== undefined ? l.id : 'layer-' + n);
  const enabled = (l) => l.enabled !== false && (typeof l.level === 'number' && Number.isFinite(l.level) ? l.level > 0 : true);

  /** Why a layer is held back from the worker, or null. */
  function paused(l) {
    const load = typeof l.code === 'string' ? loadHangs.get(l.code) : undefined;
    if (load) return { load: true, error: load };
    const h = hung.get(l.id);
    return h && h.code === l.code ? h : null;
  }

  function post(job) {
    if (!worker) return;
    if (job.type === 'look') {
      job.compiling = undefined;
      sentLook = job.layers;
      worker.postMessage({ type: 'look', layers: job.layers.filter((l) => !paused(l)) });
    } else {
      if (job.type === 'frame' || job.type === 'render') job.look = sentLook;
      worker.postMessage(job.msg);
    }
    if (!jobs.length) job.at = now();
    jobs.push(job);
    tickOn();
  }

  // -- from the app --------------------------------------------------------------------------

  function fromApp(msg) {
    let job;
    switch (msg.type) {
      case 'init':
        cathedral = msg.cathedral;
        count = cathedral && cathedral.count > 0 ? cathedral.count | 0 : 0;
        job = { type: 'init', msg: { type: 'init', cathedral } };
        break;
      case 'look': {
        // Layer objects pass through intact (clips, params, …); only a missing id is filled in.
        const layers = (Array.isArray(msg.layers) ? msg.layers : [])
          .filter((l) => l && typeof l === 'object')
          .map((l, n) => (l.id !== undefined ? l : { ...l, id: layerId(l, n) }));
        for (const [id, h] of hung) {
          const l = layers.find((x) => x.id === id);
          if (!l || l.code !== h.code) hung.delete(id);     // edited or gone: give it another go
        }
        job = { type: 'look', layers };
        break;
      }
      case 'frame':
        job = { type: 'frame', seq: msg.seq, t: +msg.t || 0, answerBy: now() + ANSWER_MS, msg: { type: 'frame', seq: msg.seq, t: +msg.t || 0 } };
        break;
      case 'render':
        job = { type: 'render', seq: msg.seq, start: +msg.start || 0, fps: +msg.fps > 0 ? +msg.fps : 40, done: 0, sentDone: 0, sentAt: now(), msg };
        break;
      default:
        return;
    }
    if (held) { held.push(job); tickOn(); } else post(job);
  }

  window.addEventListener('message', (event) => {
    if (event.source !== app) return;
    const msg = event.data;
    if (msg && typeof msg === 'object' && typeof msg.type === 'string') fromApp(msg);
  });

  // -- from the worker -----------------------------------------------------------------------

  function onWorker(w, m) {
    if (w !== worker || !m || typeof m !== 'object') return;
    const job = jobs[0];
    if (!job) return;
    switch (m.type) {
      case 'compiling':
        if (job.type === 'look') job.compiling = m.id;
        return;
      case 'progress':
        if (job.type !== 'render' || m.seq !== job.seq || !(m.done > job.done)) return;
        job.done = m.done;
        job.at = now();
        if (!job.answered && (job.done - job.sentDone >= PROGRESS_EVERY || job.at - job.sentAt >= PROGRESS_MS)) {
          job.sentDone = job.done;
          job.sentAt = job.at;
          toApp({ type: 'progress', seq: job.seq, done: job.done });
        }
        return;
      case 'ready': if (job.type !== 'init') return; break;
      case 'compiled': if (job.type !== 'look') return; break;
      case 'frame': if (job.type !== 'frame' || m.seq !== job.seq) return; break;
      case 'rendered': if (job.type !== 'render' || m.seq !== job.seq) return; break;
      case 'error': if (m.request !== job.type) return; break;
      default: return;
    }
    jobs.shift();
    if (jobs.length) jobs[0].at = now();     // the next job's clock starts now
    finish(job, m);
  }

  function finish(job, m) {
    if (job.type === 'look' && m.type === 'compiled') {
      baseLook = job.layers;
      for (const r of Array.isArray(m.layers) ? m.layers : []) {
        if (r && r.ok && r.params && typeof r.params === 'object') schemas.set(r.id, r.params);
      }
    }
    if (job.internal || job.answered) return;
    switch (m.type) {
      case 'ready':
        toApp({ type: 'ready' });
        break;
      case 'compiled':
        toApp({ type: 'compiled', layers: compiledReport(job.layers, m.layers) });
        break;
      case 'frame': {
        const rgb = m.rgb instanceof Float32Array ? m.rgb : new Float32Array(count * 3);
        toApp({ type: 'frame', seq: job.seq, rgb, errors: withPaused(m.errors, job.look), ms: +m.ms || 0 }, [rgb.buffer]);
        break;
      }
      case 'rendered': {
        if (!(m.channels instanceof Uint8Array)) { toApp({ type: 'error', seq: job.seq, request: 'render', error: 'The sandbox returned no channel data.' }); break; }
        toApp({ type: 'rendered', seq: job.seq, channels: m.channels, frames: m.frames, channelCount: m.channelCount,
          errors: withPaused(m.errors, job.look) }, [m.channels.buffer]);
        break;
      }
      case 'error':
        toApp({ type: 'error', seq: job.seq, request: job.type, error: String(m.error || 'error') });
        break;
      default:
        break;
    }
  }

  /** The worker's report, plus paused layers in their places. */
  function compiledReport(layers, report) {
    const byId = new Map((Array.isArray(report) ? report : []).filter((r) => r && typeof r === 'object').map((r) => [r.id, r]));
    return layers.map((l) => {
      const p = paused(l);
      if (p && p.load) return { id: l.id, ok: false, error: p.error, params: {} };
      if (p) return { id: l.id, ok: true, params: p.params || schemas.get(l.id) || {} };
      const r = byId.get(l.id);
      if (!r) return { id: l.id, ok: false, error: 'The sandbox did not report this layer.', params: {} };
      const out = { id: l.id, ok: !!r.ok, params: r.params && typeof r.params === 'object' ? r.params : {} };
      if (!r.ok) out.error = String(r.error || 'error');
      return out;
    });
  }

  /** Frame errors, plus one for each paused layer that would be playing. */
  function withPaused(errors, look) {
    const out = Array.isArray(errors) ? errors.filter((e) => e && typeof e === 'object').map((e) => ({ id: e.id, error: String(e.error) })) : [];
    for (const l of look || []) {
      const p = enabled(l) && paused(l);
      if (p && !out.some((e) => e.id === l.id)) out.push({ id: l.id, error: p.error });
    }
    return out;
  }

  function answerBlack(job) {
    job.answered = true;
    const rgb = new Float32Array(count * 3);
    toApp({ type: 'frame', seq: job.seq, rgb, errors: withPaused([], job.look || sentLook), ms: 0 }, [rgb.buffer]);
  }

  // -- watchdog ------------------------------------------------------------------------------

  function tickOn() {
    if (timer) return;
    lastTick = now();
    timer = setInterval(tick, TICK_MS);
  }

  function tick() {
    const t = now();
    const gap = t - lastTick;
    lastTick = t;
    if (gap > FROZEN_GAP_MS) {
      // This thread (shared with the app) was busy, throttled or frozen. Whatever the worker did
      // meanwhile may still be queued for us, so restart the clocks instead of blaming patterns.
      for (const j of jobs) { j.at += gap; j.overdue = false; if (j.answerBy) j.answerBy += gap; }
      for (const j of held || []) if (j.answerBy) j.answerBy += gap;
      return;
    }
    for (const j of jobs) if (j.type === 'frame' && !j.answered && t > j.answerBy) answerBlack(j);
    for (const j of held || []) if (j.type === 'frame' && !j.answered && t > j.answerBy) answerBlack(j);
    const head = jobs[0];
    if (head && !held) {
      const budget = head.type === 'init' ? INIT_BUDGET_MS : head.type === 'look' ? LOOK_BUDGET_MS : FRAME_BUDGET_MS;
      if (t - head.at > budget) {
        // Overdue on two ticks in a row: a reply already queued behind this tick gets its chance.
        if (head.overdue) { onHang(head); return; }
        head.overdue = true;
      }
    }
    if (!jobs.length && !held) { clearInterval(timer); timer = 0; }
  }

  // -- hangs ---------------------------------------------------------------------------------

  async function onHang(job) {
    if (worker) worker.terminate();
    worker = null;
    const pending = jobs;
    jobs = [];
    held = [];
    let renderError = '';
    if (job.type === 'look') {
      // The worker says which layer it was compiling; top-level code hangs the same way each time.
      const l = job.layers.find((x) => x.id === job.compiling);
      if (l) remember(loadHangs, l.code, 'Pattern hung while loading: its top-level code ran for over 1 s, so this version is paused. Edit the code to try again.');
    } else if (job.type === 'frame' || job.type === 'render') {
      const t = job.type === 'frame' ? job.t : job.start + job.done / job.fps;
      const suspects = (job.look || []).filter((l) => enabled(l) && !paused(l));
      let culprits = suspects.length === 1 ? suspects : await probeAll(suspects, t);
      let error = `Pattern hung: a frame took over 1 s (at ${t.toFixed(2)} s), so this layer is paused. Edit its code to try again.`;
      if (!culprits.length && suspects.length) {
        strikes = strikes.filter((s) => now() - s < STRIKE_WINDOW_MS);
        strikes.push(now());
        if (strikes.length >= 2) {
          strikes = [];
          culprits = suspects;
          error = 'Pattern hung: frames kept taking over 1 s but no single layer hangs on its own, so the look may be too heavy for this device. Paused; edit the code to try again.';
        } else if (job.type === 'frame') {
          toApp({ type: 'error', seq: job.seq, request: 'frame', error: 'A frame took over 1 s, so the pattern engine restarted.' });
        }
      }
      for (const l of culprits) hung.set(l.id, { code: l.code, error, params: schemas.get(l.id) });
      if (job.type === 'render') {
        const names = culprits.map((l) => `“${l.title || l.id}”`).join(', ');
        renderError = culprits.length
          ? `Export stopped: ${names} hung at ${t.toFixed(2)} s and ${culprits.length > 1 ? 'are' : 'is'} paused now. Fix the code and export again.`
          : 'Export stopped: a frame took over 1 s. Try again, or simplify the look.';
      }
    }
    restart(pending, job, renderError);
  }

  function remember(map, key, value) {
    map.delete(key);
    map.set(key, value);
    while (map.size > 16) map.delete(map.keys().next().value);
  }

  function restart(pending, hungJob, renderError) {
    const queue = held;
    held = null;
    worker = startWorker();
    if (!worker) return;
    if (cathedral) post({ type: 'init', internal: true, msg: { type: 'init', cathedral } });
    post({ type: 'look', internal: true, layers: baseLook });
    for (const j of pending) {
      if (j.internal || j.answered) continue;
      if (j === hungJob && j.type === 'render') {
        toApp({ type: 'error', seq: j.seq, request: 'render', error: renderError || 'Export stopped: the pattern engine restarted.' });
        continue;
      }
      j.overdue = false;
      if (j.type === 'render') { j.done = 0; j.sentDone = 0; }
      post(j);
    }
    for (const j of queue) if (!j.answered) post(j);
  }

  /** Run each suspect alone for one frame at time t; resolve with the ones that hang. */
  async function probeAll(layers, t) {
    const out = [];
    for (let i = 0; i < layers.length; i += PROBE_PARALLEL) {
      const batch = layers.slice(i, i + PROBE_PARALLEL);
      const results = await Promise.all(batch.map((l) => probe(l, t)));
      batch.forEach((l, n) => { if (results[n] === 'hung') out.push(l); });
    }
    return out;
  }

  function probe(layer, t) {
    return new Promise((resolve) => {
      let w;
      try { w = new Worker(workerUrl, { name: 'folly-probe' }); } catch { resolve('unknown'); return; }
      let started = false;
      let timeout = setTimeout(() => done('unknown'), PROBE_START_MS);
      function done(result) {
        clearTimeout(timeout);
        w.terminate();
        resolve(result);
      }
      w.onerror = (e) => { e.preventDefault(); };
      w.onmessage = (e) => {
        const m = e.data || {};
        if (!started && m.type === 'ready') {
          started = true;
          clearTimeout(timeout);
          timeout = setTimeout(() => done('hung'), PROBE_MS);
        } else if (started && m.type === 'frame' && m.seq === -1) done('ok');
        else if (m.type === 'error') done('ok');          // an error is not a hang
      };
      w.postMessage({ type: 'init', cathedral });
      w.postMessage({ type: 'look', layers: [layer] });
      w.postMessage({ type: 'frame', seq: -1, t });
    });
  }

  worker = startWorker();       // parse the core while the app fetches the cathedral
  if (worker) toApp({ type: 'ready' });
})();
</script>
</body>
</html>
